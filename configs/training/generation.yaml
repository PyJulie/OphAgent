# Diffusion model training config

task: generation

data:
  dataset: kermany
  root: datasets/kermany/train
  image_size: 256
  batch_size: 16
  num_workers: 4

model:
  type: diffusion
  image_channels: 1
  timesteps: 1000
  beta_start: 0.0001
  beta_end: 0.02
  base_channels: 64

training:
  max_epochs: 200
  learning_rate: 0.0002
  weight_decay: 0.0
  scheduler: cosine
  patience: 30
  grad_clip: 1.0
  mixed_precision: true

output:
  dir: checkpoints/generation/${data.dataset}
  log_interval: 100
  sample_interval: 10  # generate samples every N epochs
