# Self-supervised MAE pretraining config

task: ssl_pretrain

data:
  datasets:  # combine multiple datasets
    - kermany
    - octdl
    - oct_c8
  image_size: 224
  batch_size: 64
  num_workers: 8

model:
  type: mae
  img_size: 224
  patch_size: 16
  embed_dim: 768
  depth: 12
  num_heads: 12
  mask_ratio: 0.75

training:
  max_epochs: 300
  learning_rate: 0.00015
  weight_decay: 0.05
  scheduler: cosine
  warmup_epochs: 40
  grad_clip: 1.0
  mixed_precision: true

output:
  dir: checkpoints/ssl_pretrain
  log_interval: 100
