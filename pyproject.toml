[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ophagent"
version = "0.1.0"
description = "OphAgent: conversational multimodal ophthalmology AI agent (CFP / OCT / UWF / FFA)"
readme = {file = "README.md", content-type = "text/markdown"}
license-files = ["LICENSE", "THIRD_PARTY.md"]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "timm>=1.0.0",
    "monai>=1.3.0",
    "albumentations>=1.4.0",
    "opencv-python>=4.9.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0,<2.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "scikit-image>=0.22.0",
    "joblib>=1.3.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0",
    "omegaconf>=2.3.0",
    "tqdm>=4.66.0",
    "tensorboard>=2.16.0",
    "wandb>=0.16.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "kaggle>=1.6.0",
    "gdown>=5.1.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
    "PyJWT[crypto]>=2.9.0",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.9",
    "markdown>=3.6",
    "bleach>=6.1.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "nibabel>=5.2.0",
    "SimpleITK>=2.3.0",
    "pydicom>=2.4.0",
    "einops>=0.8.0",
    "transformers>=4.45.0",
    "ultralytics>=8.3.0",
    "segmentation-models-pytorch>=0.3.3",
    "accelerate>=0.33.0",
    "safetensors>=0.4.0",
    "typing-extensions>=4.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5.0", "mypy>=1.10.0"]
oct-disc = ["cupy-cuda12x>=13.0.0", "oct-converter>=0.7.0"]

[project.scripts]
ophagent = "ophagent.cli:main"
ophagent-chat = "ophagent.chat.cli:main"
ophagent-web = "ophagent.webchat.server:main"
ophagent-preflight = "ophagent.preflight:main"
ophagent-reviewer-smoke = "ophagent.reviewer_smoke:main"
ophagent-components = "ophagent.components.manager:main"
ophagent-assets = "ophagent.model_assets:main"
ophagent-release = "ophagent.release:main"

[project.urls]
Homepage = "https://github.com/PyJulie/OphAgent"
Repository = "https://github.com/PyJulie/OphAgent"
Issues = "https://github.com/PyJulie/OphAgent/issues"
Documentation = "https://github.com/PyJulie/OphAgent/tree/main/tutorials"

[tool.setuptools.packages.find]
include = ["ophagent*"]

[tool.setuptools.package-data]
"ophagent.webchat" = ["static/*.html", "static/*.css", "static/*.js"]
"ophagent" = ["resources/*.yaml"]
"ophagent.components.retsam_2" = ["README.md"]
"ophagent.components.retsam_2.postprocess.disc_cup" = ["README.md"]
"ophagent.components.retsam_2.postprocess.lesions" = ["README.md"]
"ophagent.components.retsam_2.postprocess.myopia" = ["README.md"]
"ophagent.components.retsam_2.postprocess.tessellation" = ["README.md"]
"ophagent.components.retsam_2.postprocess.vessels" = ["README.md"]
"ophagent.components.g_disc_oct4" = ["README.md"]
"ophagent.components.g_disc_oct4.configs" = ["*.json"]
"ophagent.components.g_disc_oct4.configs.pipeline" = ["*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"
